name: Project inquiry
description: Tell Raza about a project you'd like built or improved.
title: "[Project inquiry]: "
labels: ["inquiry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! Share as much as you're comfortable with — this issue is **public**, so leave out confidential details. We can move to private communication afterwards.
  - type: input
    id: organisation
    attributes:
      label: Organisation / business
      placeholder: e.g. ABC School, XYZ Trading LLC
  - type: dropdown
    id: type
    attributes:
      label: What do you need?
      multiple: true
      options:
        - ERP / management system
        - Accounting, donations or finance dashboard
        - Admin portal / internal tool
        - Learning platform or LMS
        - Website + CMS
        - Improve or maintain an existing system
        - Full-time / contract role
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should the software solve?
      description: Describe your current workflow and what is slowing you down.
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: Timeline
      options:
        - ASAP (within a month)
        - 1–3 months
        - 3+ months
        - Flexible
  - type: dropdown
    id: budget
    attributes:
      label: Budget range (optional)
      options:
        - Not sure yet
        - Small (MVP)
        - Medium
        - Large / long-term
  - type: input
    id: contact
    attributes:
      label: Preferred way to contact you
      description: LinkedIn, website or business email (it will be visible publicly).
